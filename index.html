<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול ארכליות מרכזית</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-50 text-blue-600 p-4 rounded-xl text-3xl">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">ניהול ארכליות חכם</h1>
                    <p class="text-gray-500 text-sm">מעקב סוללה וניטור "אות חיים" כל 10 דקות</p>
                </div>
            </div>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6 flex items-center gap-3">
            <div class="bg-gray-50 text-gray-400 px-4 py-3 rounded-xl">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" id="searchInput" oninput="filterBoxes()" placeholder="חפש ארכלית..." class="w-full bg-transparent font-medium text-gray-800 focus:outline-none text-lg">
        </div>

        <div id="timeoutAlert" class="hidden bg-red-50 border-2 border-red-200 text-red-700 px-5 py-4 rounded-2xl mb-6 flex items-center justify-between animate-pulse">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                <div>
                    <h4 class="font-bold">התרעת ניתוק / שגיאת תקשורת!</h4>
                    <p class="text-sm">ארכלית נמצאה בחיפוש אך לא הגיבה במשך זמן רב.</p>
                </div>
            </div>
            <button onclick="dismissAlert()"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-gray-800">רשימת מכשירים</h2>
                <button onclick="loadBoxes()" class="text-blue-600 text-sm"><i class="fa-solid fa-rotate-right"></i> רענן נתונים</button>
            </div>
            <div id="boxesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://atzcanwowaxcyosglrak.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0emNhbndvd2F4Y3lvc2dscmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2Nzc0NTYsImV4cCI6MjEwMjI1MzQ1Nn0.PaTjNkBI7SPFJejMOirlLF-Th7urptujTUUqZa6nISs';
        let allBoxes = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadBoxes();
            setInterval(loadBoxes, 4000); // רענון כל 4 שניות
        });

        async function loadBoxes() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/boxes?select=*`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                allBoxes = await res.json();
                checkTimeouts(allBoxes);
                filterBoxes();
            } catch (err) { console.error(err); }
        }

        function checkTimeouts(boxes) {
            const now = new Date().getTime();
            const hasTimeout = boxes.some(b => b.status === 'searching' && b.last_updated && (now - new Date(b.last_updated).getTime()) > 30000);
            document.getElementById('timeoutAlert').classList.toggle('hidden', !hasTimeout);
        }

        function dismissAlert() { document.getElementById('timeoutAlert').classList.add('hidden'); }
        function filterBoxes() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            renderBoxes(allBoxes.filter(b => b.box_id.toLowerCase().includes(query)));
        }

        function renderBoxes(boxes) {
            const container = document.getElementById('boxesContainer');
            if (boxes.length === 0) {
                container.innerHTML = `<div class="text-center py-10 col-span-2 text-gray-400"><p>אין נתונים להצגה.</p></div>`; return;
            }

            container.innerHTML = boxes.map(box => {
                const isSearching = box.status === 'searching';
                const isFound = box.status === 'found';
                const battery = box.battery_level ?? 100;
                
                // עיבוד זמן "אות החיים" האחרון לשעון מקומי
                let lastSeenText = "אין נתון";
                if(box.last_updated) {
                    const dateObj = new Date(box.last_updated);
                    const timeStr = dateObj.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
                    const dateStr = dateObj.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });
                    lastSeenText = `${timeStr} (${dateStr})`;
                }

                let batColor = battery < 20 ? 'bg-red-50 text-red-600 animate-pulse' : battery < 60 ? 'bg-orange-50 text-orange-600' : 'bg-green-50 text-green-700';

                return `
                    <div class="bg-white border ${isSearching ? 'border-blue-400 shadow-md ring-1 ring-blue-100' : 'border-gray-100'} rounded-2xl p-5 flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold px-2 py-1 rounded-full ${isSearching ? 'bg-blue-100 text-blue-700' : isFound ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">
                                    ${isSearching ? 'מחפש...' : isFound ? 'נמצאה' : 'במנוחה'}
                                </span>
                                <h3 class="text-xl font-bold text-gray-800 mt-2">ארכלית #${box.box_id}</h3>
                            </div>
                            <div class="flex items-center gap-1.5 px-3 py-1 rounded-xl border ${batColor}">
                                <i class="fa-solid fa-battery-half"></i> <span class="font-bold">${battery}%</span>
                            </div>
                        </div>
                        
                        <div class="text-xs text-gray-500 mb-4 bg-gray-50 inline-block px-2 py-1 rounded">
                            <i class="fa-solid fa-clock-rotate-left ml-1"></i> אות חיים אחרון: <strong>${lastSeenText}</strong>
                        </div>

                        <div class="flex gap-2 border-t border-gray-100 pt-3">
                            ${isSearching 
                                ? `<button onclick="updateBox('${box.box_id}', 'idle')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium"><i class="fa-solid fa-stop ml-1"></i> עצור</button>` 
                                : `<button onclick="updateBox('${box.box_id}', 'searching')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium"><i class="fa-solid fa-bell ml-1"></i> איתור</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateBox(boxId, newStatus) {
            await fetch(`${SUPABASE_URL}/rest/v1/boxes?box_id=eq.${boxId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus, last_updated: new Date().toISOString() })
            });
            loadBoxes();
        }
    </script>
</body>
</html>
